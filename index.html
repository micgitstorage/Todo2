<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fokus"><title>Fokus</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head><body>
<main class="app"><header><div><p id="date" class="eyebrow"></p><h1>Dein Fokus</h1><p class="muted">Plane klar. Erledige entspannt.</p></div><button id="theme" class="icon">◐</button></header>
<section class="summary"><div><small>Fortschritt</small><strong id="openCount">0 Aufgaben offen</strong></div><b id="rate">0 %</b><div class="track"><i id="bar"></i></div><p id="progress">Noch keine Aufgaben angelegt</p></section>
<section class="controls"><label class="search">⌕<input id="search" type="search" placeholder="Aufgaben durchsuchen"></label><div class="filters"><button class="active" data-filter="all">Alle</button><button data-filter="today">Heute</button><button data-filter="open">Offen</button><button data-filter="completed">Erledigt</button></div></section>
<section class="sectionHead"><div><p class="eyebrow">Aufgaben</p><h2 id="sectionTitle">Alle Aufgaben</h2></div><button id="sort" class="link">Neueste ↕</button></section>
<section id="empty" class="empty" hidden><div>✓</div><h3 id="emptyTitle">Starte deinen Fokus</h3><p id="emptyText">Lege eine neue Aufgabe an.</p><button id="emptyAdd" class="primary">Aufgabe erstellen</button></section>
<ul id="list"></ul><button id="clear" class="danger" hidden>Erledigte Aufgaben löschen</button></main>
<nav><button class="nav active">☷<small>Aufgaben</small></button><button id="add" class="fab">＋</button><button id="stats" class="nav">◔<small>Übersicht</small></button></nav>
<dialog id="editor"><form id="form"><div class="handle"></div><div class="dialogHead"><button type="button" id="cancel" class="link">Abbrechen</button><h2 id="dialogTitle">Neue Aufgabe</h2><button class="link strong">Speichern</button></div><label>Titel<input id="title" required maxlength="120" placeholder="Was möchtest du erledigen?"></label><label>Notizen<textarea id="notes" rows="4" maxlength="500" placeholder="Zusätzliche Details"></textarea></label><div class="grid"><label>Priorität<select id="priority"><option value="low">Niedrig</option><option value="medium" selected>Mittel</option><option value="high">Hoch</option></select></label><label>Fällig am<input id="due" type="date"></label></div><label class="highlight"><span><strong>Heute hervorheben</strong><small>Im Heute-Filter anzeigen</small></span><input id="important" type="checkbox"></label></form></dialog>
<dialog id="statsDialog"><div class="sheet"><div class="handle"></div><div class="dialogHead"><button id="closeStats" class="link">Schließen</button><h2>Übersicht</h2><span></span></div><div class="statsGrid"><article><span>Offen</span><strong id="sOpen">0</strong></article><article><span>Erledigt</span><strong id="sDone">0</strong></article><article><span>Heute</span><strong id="sToday">0</strong></article><article><span>Quote</span><strong id="sRate">0 %</strong></article></div></div></dialog>
<template id="tpl"><li class="card"><button class="toggle">✓</button><button class="main"><div class="titleRow"><h3></h3><i></i></div><p></p><div class="meta"><span class="due"></span><span class="today"></span></div></button><button class="delete">•••</button></li></template><script src="app.js" defer></script></body></html>
